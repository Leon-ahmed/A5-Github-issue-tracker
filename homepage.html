<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

  <!-- tailwind+DaisyUI+CSS -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
     <link rel="stylesheet" href="./style/style.css">
    
  <!-- font   -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">


<!-- icon integration -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />









</head>
<body>
 
    <header>
        <nav class="  md:flex justify-between mt-4 pb-4 bg-[#ffffff] border-b-1 border-b-[#E9E9E9]">
            <div class="navlogo  flex flex-row items-center gap-2 ml-20">
                <img src="./assets/github-logo.png" class="w-[36px]"  alt="">
                <p class="text-xl font-semibold">GitHub Issues Tracker</p>
            </div>

            <div class="pl-3 md:flex gap-4 mt-5 space-y-2">

              
                     <div class="search">
                <label class="input p-0 pl-4">
  <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2.5"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
  <input id="Search" type="search"    required placeholder="Search issues" />
  <button id="searchbtn" class="btn  btn-primary btn-soft rounded-[50pxpx] border-1 border-gray-200  ">Search</button>
</label>
             </div>
            
             <button class="btn btn-primary mr-20">
                + New Issue
             </button>


            </div>
      
        

        </nav>
    </header>

    <main class="bg-[#F8FAFC]  py-15">
         <section class=" w-11/12 mx-auto  mb-4 bg-white p-6 rounded-md shadow">
            <div  class="space-x-3 grid grid-rows-3 gap-2 sm:flex flex-row">
                <button id="All" onclick="bToggle('All')" class="btn btn-[#ffffff]  w-full bg-[#4A00FF] text-[#ffffff] sm:w-[120px]">All</button>
                <button id="Open" onclick="bToggle('Open')" class="btn btn-[#ffffff]  w-full text-[#64748B] sm:w-[120px]">Open</button>
                <button id="Close" onclick="bToggle('Close')" class="btn btn-[#ffffff] w-full text-[#64748B] sm:w-[120px]">Close</button>
            </div>

         </section>
       
         <section>
          
              <div class=" w-11/12 mx-auto flex-col  gap-5  md:flex-row bg-white p-6 rounded-t-md shadow flex justify-between ">
            <div class="flex items-center gap-3">
                  <div class="w-[50px] h-[50px] bg-[#ECE4FF] rounded-full relative ">
                     <img src="./assets/Aperture.png" class="absolute bottom-2 left-2  " alt="">
                  </div>
                
                <div class="">
                    <h3 class="text-xl font-semibold"><span id="allCount">0</span> Issues</h3>
                    <p class="gray">Track and manage your project issues</p>
                </div>
            </div>
            <div class=" flex items-center justify-center sm:justify-start  ">
                    
                   <div class="w-[12px] h-[12px] rounded-full bg-[#00A96E] mr-2"></div>
                    <p>Open</p>
                   <div class="w-[12px] h-[12px] rounded-full bg-[#A855F7] ml-5 mr-2"></div>
                   <p>Close</p>
                   


            </div>

         </div>

           <div id="spinner" class="flex justify-center items-center py-10">
        <span class=" spin loading loading-spinner text-primary  loading-xl"></span>
           </div>

         <div id="allCard" class="card-container w-11/12 mx-auto   bg-[#FBFBFB] py-6 px-6 shadow-sm grid grid-cols-1 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-4   gap-4">
             

         </div>




         </section>




         <section>
 <!-- Modal  -->
<dialog id="my_modal_4" class="modal">
  <div id="modalcontainer"></div>
  
</dialog>
         </section>
      

    </main>




<script src="./Javascript/homepage.js"></script>
   
</body>
</html>
